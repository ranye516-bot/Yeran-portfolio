<!doctype html>
<html lang="zh-CN" class="site-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0c" />
    <meta name="description" content="叶然，摄影师与视觉创作者。精选商业影像、产品短片与个人创作。" />
    <title>叶然 YERAN — 摄影与视觉创作</title>
    <link rel="icon" href="./mark.svg" type="image/svg+xml" />
    <link rel="preload" href="./media/hero-poster.webp" as="image" />
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      html.site-loading, html.site-loading body { overflow: hidden; overscroll-behavior: none; }
      .site-loading { background: #080f0d; }
    </style>
  </head>
  <body>
    <div class="opening-curtain" id="site-opening">
      <p class="opening-name" lang="en" aria-hidden="true">YERAN</p>
      <div class="opening-stage">
        <div class="opening-camera" aria-hidden="true">
          <video class="opening-clip" data-src="./media/intro-camera.mp4" poster="./media/intro-camera-poster.webp" muted playsinline preload="none"></video>
        </div>
        <div class="opening-status">
          <span class="opening-track" role="progressbar" aria-label="首屏加载进度" aria-valuenow="0"><span class="opening-progress"></span></span>
          <span><span class="opening-message" role="status">正在载入页面</span> <span class="opening-percentage" aria-hidden="true">0%</span></span>
        </div>
        <noscript><p class="opening-status">请启用 JavaScript 后刷新页面。</p></noscript>
      </div>
    </div>
    <script>
      if (['', '#top'].includes(location.hash) && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const camera = document.querySelector('.opening-clip');
        camera.preload = 'auto';
        camera.src = camera.dataset.src;
      }
    </script>
    <div id="root" inert></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
